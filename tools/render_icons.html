<!DOCTYPE html><html><head><meta charset="utf-8"><title>wait</title></head><body><pre id="o"></pre><script>
const jobs=[['icon.svg',192,'icon-192.png'],['icon.svg',512,'icon-512.png'],['icon-full.svg',512,'icon-maskable-512.png'],['icon-full.svg',180,'apple-touch-icon.png'],['favicon.svg',32,'favicon-32.png']];
(async()=>{const out=[];for(const [src,n,name] of jobs){const img=new Image();img.src='../icons/'+src+'?r='+Date.now();await img.decode();const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,n,n);out.push(name+' '+c.toDataURL('image/png'))}document.getElementById('o').textContent=out.join('\n');document.title='done'})().catch(e=>{document.getElementById('o').textContent='ERR '+e});
</script></body></html>
