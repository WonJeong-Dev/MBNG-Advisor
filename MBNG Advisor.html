function pgGear(){const f=(id,l,v)=>`<div class="field"><label>${l}</label><input type="number" id="${id}" value="${v}" min="0"></div>`;
 return `<div class="panel" id="gq"><div class="ph"><h2>현재 장착 A vs 새 장비 B</h2><span class="tiny">입력 즉시 판정</span></div>
 <div class="grid2"><div class="rbox"><b>A · 현재 장착</b><div class="grid3 mt10">${f('a1','기본 수치',3100)}${f('a2','보석 슬롯',2)}${f('a3','마도 저항',100)}</div></div><div class="rbox"><b>B · 새 장비</b><div class="grid3 mt10">${f('b1','기본 수치',3400)}${f('b2','보석 슬롯',3)}${f('b3','마도 저항',130)}</div></div></div>
 <div class="row mt10"><label class="row tiny"><input type="checkbox" id="bp">B에 각인 강화·인챈트·보석·특수 효과가 있음</label><label class="row tiny"><input type="checkbox" id="bu">B가 미감정</label></div>
 <div class="panel hl mt10" id="gres"></div></div>
 <div class="panel"><h2>판정 기준</h2><p class="hint">기본 수치·보석 슬롯·마도 저항의 단순 차이만 봅니다. 성능 개선(연금술 성능 주입)으로 강화된 장비에 더 좋은 기본 수치를 옮길 수 있으므로, 희귀도가 낮아도 수치가 높으면 재료 후보로 판정합니다. 실제 전투력·DPS는 계산하지 않습니다.</p></div>`}
function gearJudge(){if(!$('gres'))return;const v=id=>Math.max(0,Number($(id).value)||0),db=v('b1')-v('a1'),ds=v('b2')-v('a2'),dr=v('b3')-v('a3'),pro=$('bp').checked,un=$('bu').checked;
 let t,c,why;if(un){t='감정 먼저';c='var(--gold)';why='미감정 장비는 감정 후 수치를 확인하세요.'}
 else if(db>0){t='성능 개선 후보';c='var(--accent)';why=`기본 수치가 ${db} 높습니다. 지금 장비(A)에 성능 주입 재료로 쓰는 것을 먼저 검토하세요.`}
 else if(ds>0||dr>0){t='보관 · 확인';c='var(--gold)';why=`${ds>0?'보석 슬롯 +'+ds+'. ':''}${dr>0?'마도 저항 +'+dr+'. ':''}기본 수치는 낮아도 재료 가치가 있을 수 있습니다.`}
 else if(pro){t='보관 · 수동 검토';c='var(--gold)';why='강화·인챈트·보석·특수 효과를 먼저 회수하거나 확인하세요.'}
 else{t='분해 · 판매 후보';c='var(--red)';why='세 지표 모두 현재 장비보다 낫지 않습니다.'}
 const s=x=>`<b style="color:${x>0?'var(--accent)':x<0?'var(--red)':'var(--muted)'}">${x>0?'+':''}${x}</b>`;
 $('gres').innerHTML=`<div class="verdict" style="color:${c}">${t}</div><p class="hint">${why}</p><div class="row tiny">기본 수치 ${s(db)} · 보석 슬롯 ${s(ds)} · 마도 저항 ${s(dr)}</div>`}

 soul:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
 about:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
const NAV=[['class','정보','직업 정보'],['rune','정보','룬 역검색'],['cmp','정보','직업 비교'],['week','도구','주간 체크리스트'],['link','도구','숙련 연계'],['soul','도구','소울스트림'],['gear','도구','장비 비교'],['proc','생활','가공 레시피'],['gath','생활','채집 바로찾기'],['about','기타','출처 · 갱신']];
const TABS={class:'직업',week:'숙제',link:'숙련',proc:'가공',gath:'채집'};
const PAGES={class:['직업 정보','21개 직업의 주·부 스탯·개조·세공·장신구 세팅과 부위별 룬 사용 순위를 한눈에 봅니다.',pgClass],rune:['룬 역검색','룬을 고르면 어떤 직업이 몇 위로 쓰는지 자동으로 정리합니다.',pgRune],cmp:['직업 비교','두 직업의 세팅과 룬 TOP3를 나란히 비교하고 공통 룬을 찾습니다.',pgCmp],week:['주간 체크리스트','매주 월요일 06:00에 자동으로 초기화되는 주간 숙제입니다. 공식 가이드·업데이트 노트로 확인된 항목만 담았습니다.',pgWeek],link:['숙련 연계','공식 보너스표를 성급·강화 단계별로 조회하고, 무기 수치로 숙련 연계 추가 공격력을 자동 계산합니다.',pgLink],soul:['소울스트림','게임 화면의 소울 값 몇 개만 옮겨 적으면 주당 생산량, 다음 구간까지 남은 합계, 이번 주 구매 비용을 계산합니다.',pgSoul],proc:['가공 레시피','6개 가공 시설의 레시피 91개를 검색하고, 재료를 눌러 가공 단계를 따라갑니다.',pgProc],gath:['채집 바로찾기','아이템을 검색하면 어느 채집물에서 몇 레벨부터 얻는지 자동으로 정리합니다.',pgGath],gear:['장비 비교','숫자 몇 개로 성능 개선·보관·분해를 바로 판정합니다.',pgGear],about:['출처 · 갱신','데이터 출처, 기준일, 갱신 방법입니다.',pgAbout]};
function render(){if(!PAGES[S.page])S.page='class';const P=PAGES[S.page];$('pt').textContent=P[0];$('ps').textContent=P[1];$('page').innerHTML=P[2]();if(S.page==='gear')gearJudge();if(S.page==='link')linkCalc();if(S.page==='soul')soulCalc();
 document.querySelectorAll('.nav[data-nav],.tab[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.page));$('morebtn').classList.toggle('on',!TABS[S.page]);$('eb').textContent='MABINOGI MOBILE · '+NAV.find(n=>n[0]===S.page)[1]}
function go(p){S.page=p;save();$('sheet').hidden=true;render();window.scrollTo({top:0});if($('page').animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)$('page').animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.7,.2,1)'})}

/* ===== 이벤트 ===== */
document.addEventListener('click',e=>{const t=e.target;let el;
 if(el=t.closest('[data-act="more"]')){$('sheet').hidden=!$('sheet').hidden;return}
 if(el=t.closest('[data-nav]'))return go(el.dataset.nav);
 if(el=t.closest('[data-cls]')){S.sel=el.dataset.cls;save();if(el.dataset.go)return go('class');render();if(innerWidth<1100)$('cdet')?.scrollIntoView({behavior:'smooth'});return}
 if(el=t.closest('[data-fam]')){S.fam=el.dataset.fam;save();return render()}
 if(el=t.closest('[data-view]')){S.view=el.dataset.view;save();return render()}
 if(el=t.closest('[data-fav]')){const n=el.dataset.fav;S.fav=S.fav.includes(n)?S.fav.filter(x=>x!==n):[...S.fav,n];save();return render()}
 if(el=t.closest('[data-copy]'))return copyText(cText(el.dataset.copy));
 if(el=t.closest('[data-rp]')){S.rp=el.dataset.rp;S.rsel='';save();return render()}
 if(el=t.closest('[data-rsel]')){S.rsel=el.dataset.rsel;save();return render()}
 if(el=t.closest('[data-act="all"]')){S.all=!S.all;save();return render()}
 if(el=t.closest('[data-ls]')){S.ls=+el.dataset.ls;S.lall=false;save();return render()}
 if(el=t.closest('[data-lh]')){S.lh=+el.dataset.lh;save();return render()}
 if(el=t.closest('[data-act="lall"]')){S.lall=!S.lall;save();return render()}
 if(el=t.closest('[data-pf]')){S.pf=el.dataset.pf;save();return render()}
 if(el=t.closest('[data-pl]')){S.pl=+el.dataset.pl;save();return render()}
 if(el=t.closest('[data-pq]')){S.pq=el.dataset.pq;S.pf='all';S.pl=0;save();render();return window.scrollTo({top:0,behavior:'smooth'})}
 if(el=t.closest('[data-act="preset"]')){S.pq='';S.pf='all';S.pl=0;save();return render()}
 if(el=t.closest('[data-gs]')){S.gs=el.dataset.gs;save();return render()}
 if(el=t.closest('[data-gq]')){S.gq=el.dataset.gq;S.gs='all';save();render();return window.scrollTo({top:0,behavior:'smooth'})}
 if(el=t.closest('[data-goproc]')){S.pq=el.dataset.goproc;S.pf='all';S.pl=0;return go('proc')}
 if(el=t.closest('[data-charm]')){const id=el.dataset.charm;S.charm=S.charm.includes(id)?S.charm.filter(x=>x!==id):[...S.charm,id];save();return render()}
 if(el=t.closest('[data-act="charmreset"]')){S.charm=[];save();toast('새 부캐 매력 루틴을 시작합니다.');return render()}
 if(el=t.closest('[data-act="greset"]')){S.gq='';S.gs='all';save();return render()}
 if(el=t.closest('[data-wk]')){const k=el.dataset.wk,[id,i]=k.split('.'),w=WEEKLY.find(x=>x[0]===id),cur=wcnt(w,+i);S.wk.c[k]=el.dataset.d==='t'?(cur?0:1):Math.max(0,Math.min(wmax(w,+i),cur+ +el.dataset.d));save();return render()}
 if(el=t.closest('[data-whide]')){const id=el.dataset.whide;S.wk.hide=S.wk.hide.includes(id)?S.wk.hide.filter(x=>x!==id):[...S.wk.hide,id];save();return render()}
 if(el=t.closest('[data-act="wedit"]')){S.wedit=!S.wedit;save();return render()}
 if(el=t.closest('[data-act="wreset"]')){if(wArm&&Date.now()-wArm<4000){wArm=0;S.wk.c={};save();toast('이번 주 체크를 모두 해제했습니다.')}else{wArm=Date.now();setTimeout(()=>{if(wArm&&Date.now()-wArm>=4000){wArm=0;if(S.page==='week')render()}},4100)}return render()}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){S.q=el.value;save();$('clist').innerHTML=classList();return}
 if(el.id==='rq'){S.rq=el.value;save();const pos=el.selectionStart;render();const n=$('rq');n.focus();n.setSelectionRange(pos,pos);return}
 if(el.id==='pq'){S.pq=el.value;save();$('plist').innerHTML=procList();return}
 if(el.id==='gq'){S.gq=el.value;save();$('glist').innerHTML=gatherList();return}
 if(el.closest('#soulq'))return soulCalc();
 if(el.closest('#lq'))return linkCalc();
 if(el.closest('#gq'))return gearJudge()});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='ca'||el.id==='cb'){S[el.id]=el.value;save();render()}
 if(el.id==='lst'||el.id==='llv'){linkCalc();S.ls=S.lk.st;save();render()}
 if(el.id==='wpet'){S.wpet=+el.value;save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('ccard'))e.target.click();if(e.key==='Escape')$('sheet').hidden=true});

/* ===== 시작 ===== */
const navBtn=([id,,lb])=>`<button class="nav" data-nav="${id}">${svg(id)}<span>${lb}</span></button>`;
$('nav').innerHTML=NAV.map((n,i)=>(!i||NAV[i-1][1]!==n[1]?`<div class="nlabel">${n[1]}</div>`:'')+navBtn(n)).join('');
$('tabbar').innerHTML=Object.entries(TABS).map(([id,lb])=>`<button class="tab" data-nav="${id}">${svg(id)}<span>${lb}</span></button>`).join('')+`<button class="tab" id="morebtn" data-act="more" aria-label="더보기">${svg('more')}<span>더보기</span></button>`;
$('sheetnav').innerHTML=NAV.filter(n=>!TABS[n[0]]).map(navBtn).join('')+`<a class="nav" href="${RUNE_URL}" target="_blank" rel="noopener">${svg('ext')}<span>룬 도감 열기 (mabimobi.life)</span></a>`;
$('dd').textContent=DATA_DATE;
const patchA=`<a href="https://mabinogimobile.nexon.com/News/Update/${PATCH[1]}" target="_blank" rel="noopener">${PATCH[0]} 업데이트</a>`;
$('pv').innerHTML=patchA;$('pvm').textContent=`${PATCH[0]} 업데이트 기준`;$('pvf').innerHTML=`${patchA} 기준 (확인 ${PATCH[2]})`;
checkWeek();
setInterval(()=>{if(checkWeek()&&S.page==='week')render();else if($('wcd'))$('wcd').textContent=wcd()},6e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&checkWeek()&&S.page==='week')render()});
(()=>{const d=Math.floor((Date.now()-new Date(DATA_DATE+'T00:00:00+09:00'))/864e5);if(d>STALE_DAYS)$('stale').innerHTML=`<div class="notice"><span>⚠</span><span>룬 통계가 ${d}일 전 데이터입니다. 큰 패치가 있었다면 최신 순위를 확인하세요.</span><a class="btn sm" href="${RUNE_URL}" target="_blank" rel="noopener">룬 도감 ↗</a><button class="btn sm" data-nav="about">갱신 방법</button></div>`})();
render();
</script>
